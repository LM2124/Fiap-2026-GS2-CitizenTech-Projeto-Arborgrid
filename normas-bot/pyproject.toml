[project]
name = "normas-bot"
version = "1.0.0"
description = "Robô de RPA que confere a base de normas do Assistente ArborGrid SP nas fontes oficiais"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "beautifulsoup4==4.13.4",
    "pypdf==5.4.0",
    "PyYAML==6.0.2",
]

# "uv run normas-bot [opções]" roda o robô a partir da pasta normas-bot/
[project.scripts]
normas-bot = "rpa_normativo.cli:main"

[dependency-groups]
dev = ["pytest==8.3.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rpa_normativo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
