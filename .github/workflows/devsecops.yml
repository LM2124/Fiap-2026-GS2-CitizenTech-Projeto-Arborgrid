name: ArborGrid DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read  # gitleaks-action lista os commits do PR (sem isso: HTTP 403 em todo pull_request)

jobs:
  test-and-secrets-scan:
    name: Pytest, Gitleaks e Semgrep SAST
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: webapp/requirements*.txt

      - name: Install webapp test dependencies
        run: pip install -r webapp/requirements-dev.txt

      - name: Run unit and contract tests
        working-directory: webapp
        run: pytest -v

      - name: Semgrep SAST Scan
        run: |
          python -m venv /tmp/semgrep-venv
          /tmp/semgrep-venv/bin/pip install --quiet semgrep
          /tmp/semgrep-venv/bin/semgrep scan \
            --config p/python \
            --config p/dockerfile \
            --config p/terraform \
            --config p/secrets \
            --exclude .venv \
            --exclude node_modules \
            --exclude webapp/app/static \
            --error

  container-and-iac-security:
    name: Docker Build & Trivy Scan
    needs: test-and-secrets-scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Trivy IaC & Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "config"
          scan-ref: "infra/"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: Build slim non-root container image
        run: docker build -t arborgrid-webapp:${{ github.sha }} webapp

      - name: Trivy Container Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "image"
          image-ref: "arborgrid-webapp:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

  deploy-to-vm:
    name: Deploy Automatico VM (IAP + Docker Compose)
    needs: container-and-iac-security
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write  # token OIDC para o Workload Identity Federation (sem chave JSON)
    env:
      GCP_ZONE: ${{ vars.GCP_ZONE || 'us-central1-a' }}
      VM_NAME: ${{ vars.GCP_VM_NAME || 'arborgrid-vm' }}
      VM_USER: ${{ vars.VM_USER || 'ubuntu' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate deploy configuration
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SA: ${{ secrets.GCP_DEPLOY_SA }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          missing=""
          for name in GCP_WIF_PROVIDER GCP_DEPLOY_SA VM_SSH_KEY VM_KNOWN_HOSTS; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets de deploy ausentes:$missing (ver infra/ARQUITETURA_CLOUD_DEVSECOPS.md)."
            exit 1
          fi

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure SSH through the IAP tunnel
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          # Secrets gravados por pipe do PowerShell chegam com BOM UTF-8 e/ou CRLF: o OpenSSH recusa ("error in libcrypto")
          (umask 077 && printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' | sed '1s/^\xEF\xBB\xBF//' > ~/.ssh/deploy_key)
          if ! ssh-keygen -l -f ~/.ssh/deploy_key || ! ssh-keygen -y -P '' -f ~/.ssh/deploy_key > /dev/null; then
            echo "::error::VM_SSH_KEY nao e uma chave privada OpenSSH valida e sem senha (grave pelo Git Bash: gh secret set VM_SSH_KEY < ~/.ssh/arborgrid_ci)."
            exit 1
          fi
          # Chave de host fixada (sem ssh-keyscan/TOFU): linhas no formato "arborgrid-vm ssh-ed25519 AAAA..."
          # (remove CR de secrets gravados no Windows, comentarios e linhas vazias)
          printf '%s\n' "$VM_KNOWN_HOSTS" | tr -d '\r' | sed '1s/^\xEF\xBB\xBF//' | grep -v -e '^#' -e '^[[:space:]]*$' > ~/.ssh/known_hosts || true
          if ! ssh-keygen -l -f ~/.ssh/known_hosts; then
            echo "::error::VM_KNOWN_HOSTS sem chave de host valida (esperado: 'arborgrid-vm ssh-ed25519 AAAA...'). Ver infra/ARQUITETURA_CLOUD_DEVSECOPS.md."
            exit 1
          fi
          cat > ~/.ssh/config <<EOF
          Host arborgrid-vm
            HostName ${VM_NAME}
            HostKeyAlias arborgrid-vm
            User ${VM_USER}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ProxyCommand gcloud compute start-iap-tunnel ${VM_NAME} 22 --listen-on-stdin --zone=${GCP_ZONE} --verbosity=warning
          EOF
          chmod 600 ~/.ssh/config
          ssh arborgrid-vm 'echo "Conexao IAP OK: $(hostname)"'

      - name: Sync codebase to the VM
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.venv' \
            --exclude 'infra/.env' \
            --exclude 'webapp/frontend/node_modules' \
            --exclude 'arborgrid-vision/models/*.pt' \
            --exclude 'arborgrid-vision/dataset/sp_geosampa_api/images' \
            --exclude 'arborgrid-vision/dataset/sp_geosampa_api/*overlays*' \
            --exclude 'llm-assistant/models/*.gguf' \
            ./ arborgrid-vm:/opt/arborgrid/app/

      - name: Rebuild containers and smoke test
        run: |
          ssh arborgrid-vm 'bash -s' <<'EOF'
            set -euo pipefail
            if [ ! -f /opt/arborgrid/app/infra/.env ]; then
              echo "::error::/opt/arborgrid/app/infra/.env nao existe na VM (provisione com scripts/deploy_vm.py)."
              exit 1
            fi
            # O container roda como UID 10001: midias montadas precisam de leitura/travessia para "outros"
            sudo chmod -R a+rX /opt/arborgrid/media || true
            cd /opt/arborgrid/app/infra
            docker compose --env-file .env up -d --build --remove-orphans
            docker image prune -f
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1/api/v1/health > /dev/null; then
                echo "Health check OK apos ${i} tentativa(s)."
                exit 0
              fi
              sleep 3
            done
            echo "::error::Health check falhou apos o deploy."
            docker compose --env-file .env ps
            exit 1
          EOF
