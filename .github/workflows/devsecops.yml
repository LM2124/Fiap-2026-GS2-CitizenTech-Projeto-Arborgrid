name: ArborGrid DevSecOps Pipeline

# Fluxo: testes e scanners -> imagem construida e escaneada UMA vez -> publicada no
# Artifact Registry -> VM baixa exatamente aquele digest. Nenhum segredo de longa duracao:
# Workload Identity Federation (OIDC) para o GCP e OS Login com chave efemera pelo IAP.
# Actions fixadas por SHA de commit (o Dependabot propoe as atualizacoes).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read  # gitleaks-action lista os commits do PR (sem isso: HTTP 403 em todo pull_request)

env:
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  AR_REPOSITORY: ${{ vars.GCP_AR_REPOSITORY || 'arborgrid' }}

jobs:
  test-and-secrets-scan:
    name: Pytest, Gitleaks e Semgrep SAST
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: webapp/frontend/package-lock.json

      # tsc -b + vite build: falha em erro de tipo e gera o app/static usado pelos testes
      - name: Build e checagem de tipos do frontend
        working-directory: webapp/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Setup Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: webapp/requirements*.txt

      - name: Install webapp test dependencies
        run: pip install -r webapp/requirements-dev.txt

      - name: Run unit and contract tests
        working-directory: webapp
        run: pytest -v

      - name: Semgrep SAST Scan
        run: |
          python -m venv /tmp/semgrep-venv
          /tmp/semgrep-venv/bin/pip install --quiet semgrep
          /tmp/semgrep-venv/bin/semgrep scan \
            --config p/python \
            --config p/dockerfile \
            --config p/terraform \
            --config p/secrets \
            --exclude .venv \
            --exclude node_modules \
            --exclude webapp/app/static \
            --error

  container-and-iac-security:
    name: Docker Build & Trivy Scan
    needs: test-and-secrets-scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write  # publicar no Artifact Registry via WIF (so no push da main)
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Trivy IaC Scan (Terraform, Compose, Dockerfile)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "config"
          scan-ref: "."
          skip-dirs: "webapp/frontend/node_modules,arborgrid-vision/dataset"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: Image name
        id: meta
        run: |
          echo "repo=${GCP_REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${AR_REPOSITORY}/webapp" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Multi-stage: compila o frontend (Node) e o backend; imagem final slim e sem root
      - name: Build slim non-root container image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: webapp
          load: true
          push: false
          tags: ${{ steps.meta.outputs.repo }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Container Image Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "image"
          image-ref: "${{ steps.meta.outputs.repo }}:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Setup gcloud CLI
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Publica a MESMA imagem que o Trivy escaneou e repassa o digest imutavel ao deploy
      - name: Push scanned image to Artifact Registry
        id: push
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker push "${{ steps.meta.outputs.repo }}:${{ github.sha }}"
          digest_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "${{ steps.meta.outputs.repo }}:${{ github.sha }}")"
          echo "Imagem publicada: ${digest_ref}"
          echo "image=${digest_ref}" >> "$GITHUB_OUTPUT"

  deploy-to-vm:
    name: Deploy Automatico VM (IAP + Docker Compose)
    needs: container-and-iac-security
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write  # token OIDC para o Workload Identity Federation (sem chave JSON)
    env:
      GCP_ZONE: ${{ vars.GCP_ZONE || 'us-central1-a' }}
      VM_NAME: ${{ vars.GCP_VM_NAME || 'arborgrid-vm' }}
      IMAGE: ${{ needs.container-and-iac-security.outputs.image }}
    steps:
      # A VM so recebe a configuracao (infra/) e o modelo ONNX; o codigo chega dentro da imagem
      - name: Checkout deploy payload
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            infra
            arborgrid-vision/models

      - name: Validate deploy configuration
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SA: ${{ secrets.GCP_DEPLOY_SA }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          missing=""
          for name in GCP_WIF_PROVIDER GCP_DEPLOY_SA GCP_PROJECT_ID IMAGE; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Configuracao de deploy ausente:$missing (ver infra/ARQUITETURA_CLOUD_DEVSECOPS.md)."
            exit 1
          fi
          case "$IMAGE" in *@sha256:*) ;; *) echo "::error::IMAGE sem digest: $IMAGE"; exit 1 ;; esac

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Chave SSH criada aqui, registrada no OS Login por 30 min e descartada no fim do job.
      # A chave de host vem dos guest attributes da VM pela API autenticada (sem TOFU).
      - name: Ephemeral SSH via OS Login and IAP
        run: |
          install -m 700 -d ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -C "gha-run-${GITHUB_RUN_ID}" -f ~/.ssh/deploy_key
          gcloud compute os-login ssh-keys add --key-file ~/.ssh/deploy_key.pub --ttl 30m --quiet > /dev/null
          os_user="$(gcloud compute os-login describe-profile --format='value(posixAccounts[0].username)')"
          gcloud compute instances get-guest-attributes "$VM_NAME" --zone "$GCP_ZONE" \
            --query-path=hostkeys/ --format='value(key,value)' \
            | awk '{print "arborgrid-vm", $1, $2}' > ~/.ssh/known_hosts
          if ! ssh-keygen -l -f ~/.ssh/known_hosts; then
            echo "::error::Sem chaves de host nos guest attributes da VM (metadata enable-guest-attributes=TRUE?)."
            exit 1
          fi
          cat > ~/.ssh/config <<EOF
          Host arborgrid-vm
            HostName ${VM_NAME}
            HostKeyAlias arborgrid-vm
            User ${os_user}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ProxyCommand gcloud compute start-iap-tunnel ${VM_NAME} 22 --listen-on-stdin --zone=${GCP_ZONE} --verbosity=warning
          EOF
          chmod 600 ~/.ssh/config
          ssh arborgrid-vm 'echo "Conexao IAP + OS Login OK: $(hostname) como $(whoami)"'

      - name: Sync configuration and vision model
        run: |
          ssh arborgrid-vm 'sudo install -d -m 755 /opt/arborgrid/app/infra /opt/arborgrid/vision_models'
          # .env (segredos) mora so na VM; Terraform nao vai para la
          rsync -rlptz --delete --rsync-path="sudo rsync" \
            --exclude '.env' --exclude 'terraform/' \
            infra/ arborgrid-vm:/opt/arborgrid/app/infra/
          rsync -rlptz --rsync-path="sudo rsync" \
            arborgrid-vision/models/segformer_v3_int8_dyn_matmul.onnx arborgrid-vm:/opt/arborgrid/vision_models/

      - name: Deploy pinned image, hot-reload configs and smoke test
        run: |
          ssh arborgrid-vm "IMAGE='${IMAGE}' REGISTRY='${GCP_REGION}-docker.pkg.dev' bash -s" <<'EOF'
            set -euo pipefail
            cd /opt/arborgrid/app/infra
            if [ ! -f .env ]; then
              echo "::error::/opt/arborgrid/app/infra/.env nao existe na VM (provisione com scripts/deploy_vm.py bootstrap)."
              exit 1
            fi
            # Fixa o digest publicado pelo CI e a pasta do modelo de visao no .env da VM
            sudo sed -i '/^ARBORGRID_WEBAPP_IMAGE=/d;/^ARBORGRID_VISION_MODELS_DIR=/d' .env
            printf 'ARBORGRID_WEBAPP_IMAGE=%s\nARBORGRID_VISION_MODELS_DIR=/opt/arborgrid/vision_models\n' "$IMAGE" | sudo tee -a .env > /dev/null

            # Pull com token de curta duracao da service account da VM (metadata server)
            curl -fsS -H 'Metadata-Flavor: Google' \
              'http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token' \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' \
              | sudo docker login -u oauth2accesstoken --password-stdin "https://${REGISTRY}" > /dev/null
            sudo docker compose --env-file .env pull webapp
            sudo docker logout "https://${REGISTRY}" > /dev/null
            sudo docker compose --env-file .env up -d --no-build --remove-orphans

            # Configs montadas por pasta: recarga a quente, sem derrubar conexoes
            sudo docker compose exec -T nginx nginx -s reload
            sudo docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
            curl -fsS -X POST http://127.0.0.1:9090/-/reload
            sudo docker image prune -f > /dev/null

            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1/api/v1/health > /dev/null; then
                echo "Health check OK apos ${i} tentativa(s)."
                echo "Imagem em execucao: $(sudo docker inspect arborgrid-webapp --format '{{.Config.Image}}')"
                # Antes, o repositorio inteiro era copiado para a VM; agora so infra/ precisa estar la
                sudo find /opt/arborgrid/app -mindepth 1 -maxdepth 1 ! -name infra -exec rm -rf {} +
                exit 0
              fi
              sleep 3
            done
            echo "::error::Health check falhou apos o deploy."
            sudo docker compose --env-file .env ps
            exit 1
          EOF

      - name: Revoke ephemeral SSH key
        if: always()
        run: |
          if [ -f ~/.ssh/deploy_key.pub ]; then
            gcloud compute os-login ssh-keys remove --key-file ~/.ssh/deploy_key.pub --quiet || true
          fi
