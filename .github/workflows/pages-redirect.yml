name: ArborGrid Pages Redirect

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages-redirect.yml"
      - "infra/terraform/**"
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL opcional de destino (ex.: http://34.123.45.67). Deixe vazio para consultar GCP/Secrets."
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy-pages:
    name: Publish GitHub Pages Redirect
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check credential mode
        env:
          INPUT_URL: ${{ inputs.target_url }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "${INPUT_URL:-}" ] && [ -n "${GCP_SA_KEY:-}" ]; then
            echo "USE_GCP_LOOKUP=true" >> "$GITHUB_ENV"
          else
            echo "USE_GCP_LOOKUP=false" >> "$GITHUB_ENV"
          fi

      - name: Authenticate to Google Cloud (optional auto-lookup)
        if: env.USE_GCP_LOOKUP == 'true'
        id: gcp_auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK (optional auto-lookup)
        if: steps.gcp_auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve target MVP URL and build _site/index.html
        env:
          INPUT_URL: ${{ inputs.target_url }}
          SECRET_HOST: ${{ secrets.VM_HOST || secrets.EC2_HOST }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_ZONE: ${{ vars.GCP_ZONE || 'us-central1-a' }}
          GCP_VM_NAME: ${{ vars.GCP_VM_NAME || 'arborgrid-mvp-vm' }}
          GCP_AUTH_OK: ${{ steps.gcp_auth.outcome }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          TARGET=""
          if [ -n "${INPUT_URL:-}" ]; then
            TARGET="${INPUT_URL}"
          elif [ "${GCP_AUTH_OK:-}" = "success" ]; then
            PROJECT_ARG=""
            if [ -n "${GCP_PROJECT_ID:-}" ]; then
              PROJECT_ARG="--project=${GCP_PROJECT_ID}"
            fi
            VM_IP="$(gcloud compute instances describe "${GCP_VM_NAME}" \
              ${PROJECT_ARG} \
              --zone="${GCP_ZONE}" \
              --format='get(networkInterfaces[0].accessConfigs[0].natIP)' 2>/dev/null || true)"
            if [ -n "${VM_IP:-}" ]; then
              TARGET="http://${VM_IP}"
            fi
          fi

          if [ -z "${TARGET:-}" ] && [ -n "${SECRET_HOST:-}" ]; then
            case "${SECRET_HOST}" in
              http://*|https://*) TARGET="${SECRET_HOST}" ;;
              *) TARGET="http://${SECRET_HOST}" ;;
            esac
          fi

          if [ -z "${TARGET:-}" ]; then
            echo "::warning::Nenhum IP configurado via GCP_SA_KEY ou VM_HOST/EC2_HOST; gerando redirecionador de fallback para o repositorio."
            TARGET="https://github.com/${GITHUB_REPO}"
          fi

          TARGET="${TARGET%/}"
          TARGET_URL="$TARGET" python3 - <<'PY'
          import html
          import json
          import os
          import re
          from pathlib import Path

          target = os.environ["TARGET_URL"]
          if not re.match(r"^https?://[A-Za-z0-9.:/-]+$", target):
              raise SystemExit(f"TARGET URL invalida: {target}")

          escaped = html.escape(f"{target}/", quote=True)
          js_target = json.dumps(target)
          page = f"""<!DOCTYPE html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>ArborGrid SP — Redirecionando para o MVP</title>
            <meta http-equiv="refresh" content="0; url={escaped}" />
            <script>
              (function () {{
                var base = {js_target};
                var suffix = (window.location.search || "") + (window.location.hash || "");
                window.location.replace(base + "/" + suffix);
              }})();
            </script>
            <style>
              body {{ font-family: system-ui, -apple-system, sans-serif; background: #f4f7f4; color: #18241b; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; padding: 24px; }}
              .card {{ max-width: 480px; background: #fff; border: 1px solid #d5e0d1; border-radius: 10px; padding: 28px; box-shadow: 0 6px 20px rgba(27,67,50,0.08); }}
              h1 {{ margin: 0 0 8px; font-size: 1.25rem; color: #1b4332; }}
              p {{ margin: 0 0 18px; line-height: 1.5; color: #4a5d4e; font-size: 0.95rem; }}
              a.btn {{ display: inline-block; background: #1b4332; color: #fff; text-decoration: none; font-weight: 600; padding: 10px 16px; border-radius: 6px; }}
              code {{ display: block; margin-top: 14px; font-size: 0.82rem; color: #2d4234; word-break: break-all; }}
            </style>
          </head>
          <body>
            <main class="card">
              <h1>ArborGrid SP — MVP CitizenTech</h1>
              <p>Redirecionando automaticamente para a instância ativa da aplicação em nuvem...</p>
              <a class="btn" href="{escaped}">Abrir ArborGrid SP</a>
              <code>Destino atual: {escaped}</code>
            </main>
          </body>
          </html>
          """
          import textwrap
          out = Path("_site")
          out.mkdir(parents=True, exist_ok=True)
          (out / "index.html").write_text(textwrap.dedent(page).lstrip(), encoding="utf-8")
          print("Generated _site/index.html ->", target)
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
