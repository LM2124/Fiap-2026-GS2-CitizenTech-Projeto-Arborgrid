services:
  llama-server:
    # Fixada pelo digest (build de 17/11/2026): a tag "server" e movel e quebraria a reprodutibilidade
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:5b43086e3ba7ea5794d72904654f6cd41224a9b1c6ac0398f4940ee380d30f23
    container_name: arborgrid-llama
    profiles:
      - llm
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    volumes:
      - ${ARBORGRID_LLM_MODELS_DIR:-../llm-assistant/models}:/models:ro
    command:
      - "-m"
      - "/models/arborgrid-qwen3-1.7b-q4_k_m.gguf"
      - "--alias"
      - "qwen3-1.7b-arborgrid"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "2048"
      - "-np"
      - "1"
      - "-t"
      - "${LLAMA_THREADS:-4}"
      - "--reasoning"
      - "off"
      - "--reasoning-budget"
      - "0"
      - "--no-webui"
    networks:
      - arborgrid-net

  webapp:
    # Producao: o CI publica a imagem no Artifact Registry e o deploy fixa o digest em
    # ARBORGRID_WEBAPP_IMAGE (a VM nao compila nada). Local: docker compose up --build.
    build:
      context: ../webapp
      dockerfile: Dockerfile
    image: ${ARBORGRID_WEBAPP_IMAGE:-arborgrid-webapp:latest}
    container_name: arborgrid-webapp
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment:
      ARBORGRID_API_TOKEN: ${ARBORGRID_API_TOKEN:?Defina ARBORGRID_API_TOKEN no .env}
      ARBORGRID_REQUIRE_AUTH: "true"
      ARBORGRID_EXPOSE_MEDIA_URLS: ${ARBORGRID_EXPOSE_MEDIA_URLS:-false}
      ARBORGRID_ALLOW_DEMO_SEED: ${ARBORGRID_ALLOW_DEMO_SEED:-false}
      ARBORGRID_LLM_TIMEOUT_SECONDS: ${ARBORGRID_LLM_TIMEOUT_SECONDS:-110}
      ARBORGRID_LLM_API_URL: ${ARBORGRID_LLM_API_URL:-http://llama-server:8080/v1/chat/completions}
    volumes:
      - ${ARBORGRID_MEDIA_HOST_DIR:-../arborgrid-vision/dataset/sp_geosampa_api}:/app/media:ro
      - ${ARBORGRID_VISION_MODELS_DIR:-../arborgrid-vision/models}:/app/models:ro
      - arborgrid_state:/app/state
    networks:
      - arborgrid-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: arborgrid-nginx
    restart: unless-stopped
    depends_on:
      webapp:
        condition: service_healthy
    # Sem porta publicada: so o Caddy (TLS) fala com o Nginx, pela rede interna
    expose:
      - "80"
    volumes:
      # Pasta inteira (nao o arquivo): o reload a quente enxerga a versao nova apos o rsync
      - ./nginx:/etc/nginx/conf.d:ro
    networks:
      - arborgrid-net

  caddy:
    image: caddy:2.11.9-alpine
    container_name: arborgrid-caddy
    restart: unless-stopped
    depends_on:
      - nginx
    ports:
      - "80:80"
      - "443:443"
    environment:
      ARBORGRID_DOMAIN: ${ARBORGRID_DOMAIN:?Defina ARBORGRID_DOMAIN no .env, por exemplo arborgrid.duckdns.org}
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - arborgrid-net

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: arborgrid-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/conf/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      # POST /-/reload recarrega regras e alvos sem reiniciar (porta so em 127.0.0.1)
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus:/etc/prometheus/conf:ro
    depends_on:
      - webapp
    networks:
      - arborgrid-net

  grafana:
    image: grafana/grafana:11.3.0
    container_name: arborgrid-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Defina GRAFANA_ADMIN_PASSWORD no .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - arborgrid-net

volumes:
  arborgrid_state:
  grafana_data:
  caddy_data:
  caddy_config:

networks:
  arborgrid-net:
    driver: bridge
