# Limite por IP para o assistente (cada resposta custa de 40 s a 2 min de CPU no llama.cpp)
limit_req_zone $binary_remote_addr zone=assistant:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    server_tokens off;

    # Atras do Caddy (TLS), o IP do cliente chega em X-Forwarded-For: sem isto o rate limit
    # trataria todo mundo como um unico IP (o do Caddy). So confia em origens da rede interna.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    client_max_body_size 15m;

    # Compressao: o bootstrap do mapa cai de ~438 KiB para ~45 KiB
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types application/json application/javascript text/javascript text/css application/wasm image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # Metricas ficam so na rede interna (Prometheus raspa webapp:8000 diretamente)
    location = /metrics {
        return 404;
    }

    location = /api/v1/assistant/ask {
        limit_req zone=assistant burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://webapp:8000;
        # Acima do timeout do LLM no webapp (ARBORGRID_LLM_TIMEOUT_SECONDS, padrao 110 s)
        proxy_read_timeout 150s;
    }

    location / {
        proxy_pass http://webapp:8000;
        proxy_read_timeout 60s;
    }
}
