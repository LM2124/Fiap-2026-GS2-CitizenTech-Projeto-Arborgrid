[project]
name = "arborgrid-vision"
version = "0.1.0"
description = "ArborGrid Vision — Auditoria Preventiva entre Arborização Viária e Rede Elétrica via SegFormer-B2 (1024x1024) e Morfologia OpenCV."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.10.0",
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.0",
    "nbconvert>=7.16.6",
    "numpy>=2.2.0",
    "onnx>=1.17.0",
    "onnxruntime>=1.20.0",
    "opencv-python>=4.10.0",
    "pandas>=2.2.3",
    "pillow>=11.0.0",
    "psutil>=7.0.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "transformers>=4.48.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }
